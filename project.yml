name: iurub
options:
  developmentLanguage: it
  bundleIdPrefix: it.davidecarpini
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: '2SPST82UYT'
    MARKETING_VERSION: '1.11.0'
    CURRENT_PROJECT_VERSION: '17'
targets:
  iurub:
    type: application
    platform: iOS
    sources:
      - path: iurub
        excludes:
          - Resources
      - path: iurub/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.davidecarpini.iurub
        INFOPLIST_FILE: iurub/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
  iurubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iurubTests]
    dependencies:
      - target: iurub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  iurubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [iurubUITests]
    dependencies:
      - target: iurub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  iurub:
    build:
      targets:
        iurub: all
        iurubTests: [test]
        iurubUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - iurubTests
        - iurubUITests
    archive:
      config: Release
